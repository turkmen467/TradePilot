<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePilot - Canlı İşlem Simülatörü</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js ve Luxon Zaman Eklentisi -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.2.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Üst Bilgi Çubuğu -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <h1 class="text-xl font-bold text-emerald-400">TradePilot</h1>
            <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">AUD/USD OTC</span>
        </div>
        <div class="flex items-center space-x-6">
            <div>
                <span class="text-xs text-slate-400 block">Demo Bakiye</span>
                <span id="balance-display" class="text-lg font-semibold text-emerald-400">$1,000.00</span>
            </div>
            <div id="connection-status" class="flex items-center space-x-2 text-xs bg-amber-500/10 text-amber-400 px-3 py-1.5 rounded-lg border border-amber-500/20">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span>Uzantı Bekleniyor...</span>
            </div>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-4 gap-4 max-w-7xl mx-auto w-full">
        
        <!-- Sol Grafik ve Göstergeler Alanı -->
        <div class="lg:col-span-3 flex flex-col space-y-4">
            <!-- Grafik Kartı -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex space-x-4 text-sm">
                        <div>Anlık Fiyat: <span id="current-price" class="font-mono font-bold text-white">-</span></div>
                        <div>EMA(14): <span id="val-ema" class="font-mono text-blue-400">-</span></div>
                        <div>RSI(14): <span id="val-rsi" class="font-mono text-purple-400">-</span></div>
                    </div>
                </div>
                <div class="relative flex-1 min-h-[350px]">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Sağ Kontrol ve İşlem Paneli -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex flex-col justify-between space-y-4">
            <div class="space-y-4">
                <h2 class="text-base font-semibold border-b border-slate-700 pb-2">İşlem Paneli (Demo)</h2>
                
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Yatırım Tutarı ($)</label>
                    <input type="number" id="trade-amount" value="100" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono focus:outline-none focus:border-emerald-500">
                </div>

                <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 text-xs space-y-1.5 text-slate-300">
                    <div class="flex justify-between"><span>Ödeme Oranı:</span> <span class="font-semibold text-emerald-400">%80</span></div>
                    <div class="flex justify-between"><span>Kazanımda Dönüş:</span> <span class="font-semibold text-emerald-400">$180 (+$80)</span></div>
                    <div class="flex justify-between"><span>Kayıpta Sonuç:</span> <span class="font-semibold text-rose-400">-$100</span></div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="executeTrade('CALL')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-emerald-900/20 flex flex-col items-center">
                        <span class="text-xs opacity-80">YUKARI</span>
                        <span class="text-lg">CALL</span>
                    </button>
                    <button onclick="executeTrade('PUT')" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-rose-900/20 flex flex-col items-center">
                        <span class="text-xs opacity-80">AŞAĞI</span>
                        <span class="text-lg">PUT</span>
                    </button>
                </div>
            </div>

            <!-- İşlem Geçmişi / Log -->
            <div class="border-t border-slate-700 pt-3">
                <h3 class="text-xs font-semibold text-slate-400 mb-2">Son İşlem Durumu</h3>
                <div id="trade-log" class="text-xs font-mono bg-slate-900 p-2.5 rounded-lg h-24 overflow-y-auto text-slate-300">
                    Henüz işlem yapılmadı.
                </div>
            </div>
        </div>

    </main>

    <!-- Mantık ve Hesaplama Betiği -->
    <script>
        let balance = 1000;
        let prices = [];
        let chart;
        let latestPrice = 0;

        // Chart.js Başlatma
        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'AUD/USD OTC',
                        data: [],
                        borderColor: '#10b981',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'second' }, grid: { color: '#334155' } },
                        y: { grid: { color: '#334155' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Teknik Göstergeler (EMA ve RSI)
        function calculateIndicators(dataArray) {
            if (dataArray.length === 0) return { ema: 0, rsi: 50 };
            
            // Basit EMA(14) Hesaplama
            const k = 2 / (14 + 1);
            let ema = dataArray[0].y;
            for (let i = 1; i < dataArray.length; i++) {
                ema = (dataArray[i].y * k) + (ema * (1 - k));
            }

            // Basit RSI(14) Hesaplama
            let gains = 0, losses = 0;
            for (let i = 1; i < Math.min(dataArray.length, 14); i++) {
                let diff = dataArray[i].y - dataArray[i-1].y;
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let rs = losses === 0 ? 100 : (gains / 14) / (losses / 14);
            let rsi = 100 - (100 / (1 + rs));

            return { ema: ema.toFixed(5), rsi: rsi.toFixed(2) };
        }

        // Chrome Uzantısından Gelen Verileri Dinleme
        window.addEventListener("message", (event) => {
            if (event.data && event.data.type === "TRADEPILOT_PRICE_UPDATE") {
                latestPrice = event.data.price;
                const now = luxon.DateTime.now().toISO();

                document.getElementById('current-price').innerText = latestPrice;
                
                // Bağlantı durum rozetini güncelle
                const statusEl = document.getElementById('connection-status');
                statusEl.className = "flex items-center space-x-2 text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-lg border border-emerald-500/20";
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>Canlı Bağlı</span>';

                // Veriyi grafiğe ekle (Son 50 veri)
                prices.push({ x: now, y: latestPrice });
                if (prices.length > 50) prices.shift();

                chart.data.datasets[0].data = prices;
                chart.update('none');

                // Göstergeleri hesapla ve yazdır
                const ind = calculateIndicators(prices);
                document.getElementById('val-ema').innerText = ind.ema;
                document.getElementById('val-rsi').innerText = ind.rsi;
            }
        });

        // Demo İşlem Yürütme ve Muhasebe Mantığı
        function executeTrade(direction) {
            if (latestPrice === 0) {
                alert("Henüz canlı fiyat verisi alınamadı. Lütfen Pocket Option sekmesinin açık olduğundan emin olun.");
                return;
            }

            const amount = parseFloat(document.getElementById('trade-amount').value);
            if (isNaN(amount) || amount <= 0) {
                alert("Geçerli bir yatırım tutarı girin.");
                return;
            }

            if (balance < amount) {
                alert("Bakiyeniz bu işlem için yetersiz!");
                return;
            }

            balance -= amount; // Yatırım tutarı bakiyeden düşülür
            updateBalanceUI();

            const entryPrice = latestPrice;
            logMessage(`${direction} açıldı: ${entryPrice}$ (${amount}$)`);

            // 5 Saniye Sonra İşlem Sonucu Simülasyonu
            setTimeout(() => {
                const exitPrice = latestPrice;
                let result = "DRAW";

                if (direction === "CALL" && exitPrice > entryPrice) result = "WIN";
                else if (direction === "PUT" && exitPrice < entryPrice) result = "WIN";
                else if (exitPrice === entryPrice) result = "DRAW";
                else result = "LOSS";

                if (result === "WIN") {
                    const payout = amount + (amount * 0.80); // Toplam dönüş 180$
                    balance += payout;
                    logMessage(`KAZANDI! +$${amount * 0.80} kâr (Toplam: $${payout})`, "text-emerald-400");
                } else if (result === "LOSS") {
                    logMessage(`KAYBETTI! -$${amount}`, "text-rose-400");
                } else {
                    balance += amount; // Beraberlikte ana para iade
                    logMessage(`BERABERE. Ana para iade ($${amount})`, "text-amber-400");
                }

                updateBalanceUI();
            }, 5000);
        }

        function updateBalanceUI() {
            document.getElementById('balance-display').innerText = `$${balance.toFixed(2)}`;
        }

        function logMessage(text, colorClass = "text-slate-300") {
            const logBox = document.getElementById('trade-log');
            const timeStr = luxon.DateTime.now().toFormat('HH:mm:ss');
            logBox.innerHTML = `<div class="${colorClass}">[${timeStr}] ${text}</div>` + logBox.innerHTML;
        }

        window.onload = initChart;
    </script>
</body>
</html>
